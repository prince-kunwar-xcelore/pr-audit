# AI review of this repo's PRs, using the gateway + pr-audit (allowlist / OIDC mode).
# Based on examples/pr-review-bun.yml in prince-kunwar-xcelore/agent-gateway.
#
# Uses Bun as the runtime — faster CI startup (~1s install), no build step needed.
# agent-gateway runs directly from TypeScript source via Bun.
#
# Pick the agent whose subscription reviews the PR with REVIEW_AGENT below.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   AGENT_GATEWAY_URL         — public URL of your proxy, e.g. https://you.ngrok-free.app
# Auth — one of:
#   Allowlist (no key):  start the proxy with `serve --allow <owner>/<repo>`. Nothing else needed;
#                        the job proves its identity with GitHub OIDC (id-token: write below).
#   Private key:         secret AGENT_GATEWAY_PRIVATE_KEY — contents of your private.pem,
#                        proxy started with `serve --public-key public.pem`.
#                        Used as the fallback when the OIDC allowlist request fails.

name: PR Review

on:
  pull_request:
    types: [opened, synchronize]

env:
  REVIEW_AGENT: claude   # claude | codex

jobs:
  review:
    name: AI PR Review
    # Fork PRs get no secrets, no OIDC token and a read-only GITHUB_TOKEN: skip instead of failing
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
      checks: write     # neutral "AI review" check when the agent's usage limit is hit
      id-token: write   # lets the job request an OIDC token for the proxy allowlist

    steps:
      - name: Checkout PR repo
        uses: actions/checkout@v4

      - name: Checkout agent-gateway
        uses: actions/checkout@v4
        with:
          repository: prince-kunwar-xcelore/agent-gateway
          ref: b52daf93f551c275119f2927f7fff4a7a830043c  # pin: agent-gateway main (bump: scripts/pin-review-tools.sh in agent-gateway)
          path: _agent-gateway

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install agent-gateway deps
        run: cd _agent-gateway && bun install

      - name: Checkout pr-audit
        uses: actions/checkout@v4
        with:
          repository: prince-kunwar-xcelore/pr-audit
          ref: 3361188583fd65e829e747dedcb6c8a855c94650  # pin: pr-audit main (bump: scripts/pin-review-tools.sh in agent-gateway)
          path: _pr-audit

      - name: Install pr-audit deps
        run: cd _pr-audit && bun install

      # Codex reads files through its bubblewrap sandbox, which Ubuntu 24.04 runners block by default
      - name: Allow the Codex sandbox
        if: env.REVIEW_AGENT == 'codex'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install agent CLI
        run: |
          case "$REVIEW_AGENT" in
            claude) bun install -g @anthropic-ai/claude-code ;;
            codex)  bun install -g @openai/codex ;;
          esac

      # Credentials go to a 0600 file and are masked: never on a command line, never in the log.
      # If decrypt-token fails, the job stops here with its real error.
      - name: Fetch agent credentials
        env:
          AGENT_GATEWAY_URL: ${{ secrets.AGENT_GATEWAY_URL }}
          AGENT_GATEWAY_PRIVATE_KEY: ${{ secrets.AGENT_GATEWAY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          umask 077
          bun "$GITHUB_WORKSPACE/_agent-gateway/src/index.ts" decrypt-token --agent "$REVIEW_AGENT" > "$RUNNER_TEMP/agent-auth"
          # mask every line and every JSON string value (credentials files can be multi-line JSON)
          { cat "$RUNNER_TEMP/agent-auth"; echo; jq -r '.. | strings' "$RUNNER_TEMP/agent-auth" 2>/dev/null || true; } |
            while IFS= read -r secret; do
              if [ "${#secret}" -ge 8 ]; then echo "::add-mask::$secret"; fi
            done

      - name: Run PR Review
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          bun "$GITHUB_WORKSPACE/_pr-audit/src/index.ts" "$PR_URL" \
            --engine "$REVIEW_AGENT-cli" \
            --auth-token-file "$RUNNER_TEMP/agent-auth"

      - name: Remove agent credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/agent-auth"
